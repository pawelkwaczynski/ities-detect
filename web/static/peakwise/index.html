<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PeakWise</title>
  <link rel="icon" href="/assets/peakwise_icon_256.png" sizes="any">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/ui.css">
  <link rel="stylesheet" href="/peakwise/styles.css">
</head>
<body class="app-body">
  <!--
    THESIS: read one electrode's peaks in three seconds, and see how the current was read.
    OWN-WORLD: the same macOS-like surface as ITIES Detect, shared tokens, no fake window chrome.
    STORY: drop a folder of scans, the app analyses them, the card and the curve explain the number.
    FIRST VIEWPORT: electrode list, toolbar, summary bar, result card with the voltammogram.
    FORM: Operate, the same frame as ITIES Detect 1.4 so moving between the two costs nothing.
    WORDS: the statuses stay PeakWise's own. A peak pair is not a verdict of guilt.
  -->
  <div class="app">
    <div class="sidebar-backdrop" id="backdrop" hidden></div>
    <aside class="sidebar" id="sidebar" data-i18n-label="sidebar.label" aria-label="Electrode list"></aside>
    <div class="main">
      <!--
        The same seven top level controls as ITIES Detect (brief 1.4 addendum 2, point Q):
        the narrow screen lead, Session, Recompute, Algorithm, Files or Table, the
        preferences, Export. PeakWise has no expert mode, so that slot stays empty.
      -->
      <header class="toolbar">
        <span class="toolbar-lead">
          <button type="button" class="drawer-toggle" id="drawer-btn" data-i18n="toolbar.list" data-i18n-label="sidebar.label">List</button>
          <a class="icon-link toolbar-home" id="toolbar-home" href="/" data-tooltip-key="tip.home" data-i18n-label="tip.homeLabel" aria-label="CV Analysers">
            <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M2.5 7.8 9 2.5l6.5 5.3V15a.5.5 0 0 1-.5.5h-3.5v-4.2h-5v4.2H3a.5.5 0 0 1-.5-.5z"/></svg>
          </a>
        </span>
        <div class="menu" id="session-menu">
          <button type="button" id="btn-session" aria-haspopup="true" aria-expanded="false" data-i18n="session.menu" data-tooltip-key="tip.session">Session</button>
          <div class="menu-list" role="menu">
            <p class="menu-heading" data-i18n="session.currentLabel">Current session</p>
            <div class="session-name-row">
              <input type="text" id="session-name" data-i18n-label="session.nameLabel" aria-label="Session name">
            </div>
            <button type="button" role="menuitem" id="session-new" data-i18n="session.new">New session</button>
            <button type="button" role="menuitem" id="session-save-file" data-i18n="session.saveFile">Save session to a file</button>
            <button type="button" role="menuitem" id="session-load-file" data-i18n="session.loadFile">Load session from a file</button>
            <input id="session-file-input" class="visually-hidden" type="file" accept=".json,application/json">
            <hr class="menu-separator">
            <button type="button" role="menuitem" class="menu-destructive" id="session-clear" data-i18n="session.clear" disabled>Clear session</button>
          </div>
        </div>
        <button type="button" id="btn-analyze" data-i18n="toolbar.recompute" data-tooltip-key="tip.recompute" disabled>Recompute all</button>
        <label class="visually-hidden" for="algo-version" data-i18n="toolbar.algoVersion">Algorithm version</label>
        <span class="algo-pick">
          <select id="algo-version" data-i18n-label="toolbar.algoVersion" aria-label="Algorithm version"></select>
          <button type="button" class="info-button" id="algo-info" data-tooltip-click aria-expanded="false" data-i18n-label="algo.info.label" aria-label="About this algorithm version">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.1v4M8 4.7h.01" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </span>
        <div class="seg" id="view-seg" role="group" data-i18n-label="toolbar.view" aria-label="View">
          <button type="button" id="view-files" aria-pressed="true" data-i18n="toolbar.viewFiles">Files</button>
          <button type="button" id="view-table" aria-pressed="false" data-i18n="toolbar.viewTable">Table</button>
        </div>
        <span class="toolbar-prefs" id="app-prefs"></span>
        <span class="toolbar-spacer" aria-hidden="true"></span>
        <div class="menu" id="export-menu">
          <button type="button" id="btn-export" aria-haspopup="true" aria-expanded="false" data-i18n="toolbar.export" data-tooltip-key="tip.export">Export</button>
          <div class="menu-list" role="menu">
            <button type="button" role="menuitem" id="export-csv" data-i18n="toolbar.exportCsv">Session CSV</button>
            <button type="button" role="menuitem" id="export-print" data-i18n="toolbar.exportPrint">Report (print)</button>
            <p class="menu-note" data-i18n="export.backgroundHint">Turn on background graphics in the print dialog, otherwise the charts will be pale.</p>
          </div>
        </div>
      </header>
      <!--
        The summary bar (addendum 4, point CC): its own strip under the toolbar. Each
        pill is the filter for its status and shares one state with the sidebar list.
        The words are PeakWise's own: a peak pair, one branch only, no peak, unreadable.
      -->
      <div class="summary-bar" id="summary-bar" hidden role="group" data-i18n-label="sidebar.filters" aria-label="Status filters" hidden></div>
      <input id="file-input" class="visually-hidden" type="file" accept=".txt,text/plain" multiple>
      <input id="folder-input" class="visually-hidden" type="file" webkitdirectory directory multiple>
      <main class="content drop-target" id="content" tabindex="-1"></main>
      <!--
        The footer holds the state on the left and the rare settings on the right
        (brief 1.4 addendum 2, point S), in the same order as ITIES Detect.
      -->
      <footer class="status-bar">
        <span class="status-left">
          <span class="status-dot" id="status-dot"></span>
          <span class="engine-status" id="engine-status" aria-live="polite">Starting the engine</span>
          <span class="status-sep" aria-hidden="true">·</span>
          <span id="analysis-status" class="muted"></span>
          <span id="session-saved" class="muted" aria-live="polite"></span>
        </span>
        <span class="status-right">
          <label class="operator"><span data-i18n="toolbar.operator">Operator</span> <input type="text" id="operator" size="10" autocomplete="name" data-tooltip-key="tip.operator"></label>
          <span class="partner-logos" id="partner-logos"></span>
          <a href="/peakwise/versions.html" data-tooltip-key="tip.versionsLink" data-i18n="versions.title">Version history</a>
          <a href="/logout" data-i18n="common.logout">Log out</a>
          <span id="app-ver" class="muted"></span>
          <span class="footer-sep" aria-hidden="true">|</span>
          <span class="muted" data-i18n="common.year">2026</span>
        </span>
      </footer>
    </div>
  </div>
  <dialog class="progress-dialog" id="batch-progress">
    <div class="dialog-head">
      <div><h2 id="progress-title" data-i18n="progress.title">Series analysis</h2><p id="progress-source" class="muted"></p></div>
      <button type="button" class="dialog-close" id="progress-close" data-i18n-label="common.close" aria-label="Close">×</button>
    </div>
    <div class="progress-metrics">
      <strong class="progress-percent tabular" id="progress-percent">0 %</strong>
      <span class="progress-value tabular" id="progress-value">0 of 0</span>
      <span class="progress-estimate" id="progress-estimate" data-i18n="progress.approximate">approximate</span>
    </div>
    <div class="progress-track" id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="progress-fill" id="progress-fill"></span>
    </div>
    <p class="progress-stage" id="progress-stage"></p>
    <dl class="progress-counts">
      <div class="tone-detected"><dt data-i18n="bucket.pair">peak pair</dt><dd id="progress-pair">0</dd></div>
      <div class="tone-uncertain"><dt data-i18n="bucket.partial">one branch</dt><dd id="progress-partial">0</dd></div>
      <div class="tone-not_detected"><dt data-i18n="bucket.none">no peak</dt><dd id="progress-none">0</dd></div>
      <div class="tone-quality"><dt data-i18n="bucket.unreadable">unreadable</dt><dd id="progress-unreadable">0</dd></div>
    </dl>
    <p id="progress-engine" class="muted"></p>
    <p id="progress-error" class="progress-error" role="alert" hidden></p>
    <div class="progress-actions">
      <button type="button" id="progress-abort" data-i18n="progress.abort">Stop</button>
    </div>
  </dialog>
  <dialog class="confirm-dialog" id="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button type="button" class="destructive" id="confirm-accept"></button>
        <button type="submit" value="cancel" id="confirm-cancel" data-i18n="session.keep">Keep</button>
      </div>
    </form>
  </dialog>
  <div id="print-root" hidden></div>
  <div id="live-results" class="visually-hidden" aria-live="polite"></div>
  <script type="module" src="/peakwise/app.js"></script>
</body>
</html>
