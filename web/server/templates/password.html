<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ copy["password.pageTitle"] }}</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/ui.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-icon" src="/assets/cv_icon_256.png"
         srcset="/assets/cv_icon_256.png 256w, /assets/cv_icon_512.png 512w"
         sizes="88px" width="88" height="88" alt="Analizatory CV">
    <h1>{{ copy["password.title"] }}</h1>
    <p class="login-who muted">{{ copy["password.who"].replace("{user}", user) }}</p>
    <form method="post" action="/password?lang={{ lang }}" novalidate>
      <label>
        <span>{{ copy["password.current"] }}</span>
        <input name="current" type="password" autocomplete="current-password" required autofocus>
      </label>
      <label>
        <span>{{ copy["password.new"] }}</span>
        <input name="fresh" type="password" autocomplete="new-password" minlength="10" required>
      </label>
      <label>
        <span>{{ copy["password.repeat"] }}</span>
        <input name="repeat" type="password" autocomplete="new-password" minlength="10" required>
      </label>
      <p class="login-hint muted">{{ copy["password.hint"] }}</p>
      <button class="primary" type="submit">{{ copy["password.submit"] }}</button>
      {% if error_key %}
      <p class="login-error" role="alert">{{ copy[error_key] }}</p>
      {% endif %}
    </form>
    <p class="login-brand"><a href="{{ back }}">{{ copy["password.back"] }}</a></p>
  </main>
</body>
</html>
